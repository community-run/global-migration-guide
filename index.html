.form-control:disabled,

.form-select:not(:disabled):hover {

.form-select:focus-visible {

.form-check-input {

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {

.form-check-input[type=&quot;radio&quot;] {

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {

  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {

.form-switch .form-check-input {

  left: 0;

}

}

}

  padding: 0;

  height: 28px;

  height: 20px;

  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);

}

.form-range:disabled {

  border-color: var(--primary);

.btn:focus-visible,
.nav-link:focus-visible {

}

.viz-carousel-controls :is(button, summary):focus-visible {

  .form-control-color[type=&quot;color&quot;] {

    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  }
}

&lt;script type=&quot;application/json&quot; id=&quot;codex-visualization-widget-state&quot;&gt;__CODEX_VISUALIZATION_WIDGET_STATE__&lt;/script&gt;

    &quot;codex-visualization-widget-state&quot;,
  );

  const pendingStateWrites = new Map();

      {

        data: { code: &quot;widget_state_persistence_failed&quot;, retryable: false },

   * @param {string} property

  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs

    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;

    &quot;message&quot;,

    }

}

    &lt;section class=&quot;gs-origin&quot; aria-labelledby=&quot;gs-why-heading&quot;&gt;
     &lt;div class=&quot;gs-origin-brand&quot;&gt;&lt;span class=&quot;gs-signal&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;世界很大，让当地经验带路。&lt;span&gt;开源共建 · 持续更新&lt;/span&gt;&lt;/div&gt;
     &lt;h1 id=&quot;gs-why-heading&quot;&gt;为什么做这份指南？&lt;/h1&gt;
     &lt;p class=&quot;gs-origin-lead&quot; data-intro-copy&gt;让真实的经历，帮后来的人少走弯路。&lt;/p&gt;
     &lt;p data-intro-copy&gt;网上不缺移民信息，但一条消息经过层层转述和包装，往往只剩下最美好的那一面。条款怎么写、当地怎么执行、落到自己身上能不能办成，中间可能隔着许多没有被说清楚的条件。&lt;/p&gt;
     &lt;p data-intro-copy style=&quot;margin-top:12px&quot;&gt;一个国家的日常生活，也可能被加上滤镜。有了可行的移居路径，自己和家人能不能适应那里的生活，仍是另一个需要认真了解的问题。真实的生活成本、语言环境、文化差异，以及那些镜头之外的日常，都值得在出发前听听当地人的亲身经历。&lt;/p&gt;
     &lt;details class=&quot;gs-origin-full&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;展开全文 · 这份指南的缘起&lt;/summary&gt;
     &lt;p data-intro-copy&gt;有人看到一篇让人心动的介绍，或者一项新法案，就开始安排另一种生活。等真正到了当地、着手办理，才发现还有没被提到的条件和问题。时间花了，钱也花了，有些选择已经很难回头。&lt;/p&gt;
     &lt;p data-intro-copy&gt;所以，我很珍惜那些愿意把具体情况、办理过程和踩坑经历写下来的人。他们的内容也许没有多少浏览量，却可能帮一个人避开一个大坑，省下几个月的时间和一笔辛苦钱。&lt;/p&gt;
     &lt;p data-intro-copy&gt;我想做这个社区，就是想让这些有价值的经验留下来，让需要它的人找得到。&lt;/p&gt;
     &lt;p data-intro-copy&gt;我们会保留作者和原文链接，注明时间、地区与适用条件，用 AI 协助整理，再由熟悉当地法规、政策和实际情况的社区核验员审核后直接发布。让当地人继续补充，让经历过的人随时纠错，把散落各处的经验，慢慢整理成一份持续更新的移居生活指南。&lt;/p&gt;
     &lt;p data-intro-copy&gt;这里拒绝中介获客、代办推广与佣金导流。我们希望每一次分享，都能帮助一个人把情况看得更清楚。&lt;/p&gt;
     &lt;p class=&quot;gs-origin-closing&quot; data-intro-copy&gt;不一定要写长文。一条亲历、一个提醒、一次纠错，都有价值。也许你认真写下的几句话，正是另一个人做决定前，最需要看到的信息。&lt;/p&gt;
     &lt;/details&gt;
     &lt;div class=&quot;gs-origin-footer&quot;&gt;&lt;div class=&quot;gs-principles&quot;&gt;&lt;span&gt;保留原作者与出处&lt;/span&gt;&lt;span&gt;社区核验员审核发布&lt;/span&gt;&lt;span&gt;持续补充与纠错&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;gs-repo&quot;&gt;&lt;a class=&quot;gs-github-pending cursor-interaction&quot; href=&quot;https://github.com/community-run/global-migration-guide&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;GitHub 共建 ↗&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;

    &lt;section class=&quot;gs-welcome-share&quot; aria-labelledby=&quot;gs-welcome-heading&quot;&gt;
     &lt;div class=&quot;gs-welcome-copy&quot;&gt;&lt;h2 id=&quot;gs-welcome-heading&quot;&gt;世界很大，&lt;br&gt;&lt;span&gt;让当地经验带路。&lt;/span&gt;&lt;/h2&gt;&lt;p&gt;提交链接后，AI 自动提炼重点、按国家归类；经当地核验员审核通过，内容才会展示在「当地华人说」，并用于持续更新对应国家指南。&lt;/p&gt;&lt;/div&gt;

    &lt;button type=&quot;button&quot; id=&quot;gs-correction-back&quot; class=&quot;gs-link cursor-interaction&quot;&gt;← 回到原页面&lt;/button&gt;&lt;p class=&quot;gs-kicker&quot; style=&quot;margin-top:18px&quot;&gt;任何读者都可以参与 · 无需登录&lt;/p&gt;&lt;h1&gt;发现不准确的地方？&lt;br&gt;一起把这一页补好。&lt;/h1&gt;&lt;p class=&quot;gs-intro&quot;&gt;提交建议后，由社区核验员核对；涉及国家概览或五星评分的变更交管理员审批。无需先加入社区，也不必留下联系方式。&lt;/p&gt;&lt;div class=&quot;gs-correction-status&quot;&gt;&lt;span class=&quot;gs-tag&quot;&gt;正在纠错&lt;/span&gt;&lt;span id=&quot;gs-correction-context&quot; class=&quot;gs-small&quot;&gt;美国 · 身份与居留&lt;/span&gt;&lt;/div&gt;
    &lt;form id=&quot;gs-correction-form&quot; class=&quot;gs-correction-panel&quot;&gt;&lt;div class=&quot;gs-title-row&quot;&gt;&lt;h2&gt;告诉我们哪里需要修改&lt;/h2&gt;&lt;button type=&quot;button&quot; id=&quot;gs-correction-example&quot; class=&quot;gs-link cursor-interaction&quot;&gt;填入示例&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;gs-correction-fields&quot;&gt;&lt;label class=&quot;gs-full&quot;&gt;原文位置或问题描述&lt;input id=&quot;gs-correction-issue&quot; required maxlength=&quot;300&quot; placeholder=&quot;例如：本页“永居时间”把两个时间混在了一起&quot;&gt;&lt;/label&gt;&lt;label class=&quot;gs-full&quot;&gt;你的修改建议&lt;textarea id=&quot;gs-correction-suggestion&quot; required maxlength=&quot;2000&quot; placeholder=&quot;你认为应该怎样修改？也可以补充发生时间、城市和相关背景。&quot;&gt;&lt;/textarea&gt;&lt;/label&gt;&lt;label class=&quot;gs-full&quot;&gt;参考链接（选填）&lt;input id=&quot;gs-correction-evidence&quot; type=&quot;url&quot; placeholder=&quot;官方资料、原帖或视频链接&quot;&gt;&lt;/label&gt;&lt;/div&gt;&lt;div class=&quot;gs-actions&quot;&gt;&lt;button type=&quot;submit&quot; class=&quot;gs-primary cursor-interaction&quot;&gt;提交纠错 · 演示&lt;/button&gt;&lt;span class=&quot;gs-small&quot;&gt;先审核，再更新正文&lt;/span&gt;&lt;/div&gt;&lt;p class=&quot;gs-small&quot; style=&quot;margin-top:12px&quot;&gt;草图演示：本次内容不会发送或保存到真实网站。&lt;/p&gt;&lt;/form&gt;
    &lt;div id=&quot;gs-correction-success&quot; hidden&gt;&lt;div class=&quot;gs-correction-panel&quot; role=&quot;status&quot;&gt;&lt;span class=&quot;gs-tag&quot;&gt;已提交 · 流程演示&lt;/span&gt;&lt;h2 style=&quot;margin-top:12px&quot;&gt;感谢你，帮下一位读者少走弯路。&lt;/h2&gt;&lt;p class=&quot;gs-small&quot;&gt;你的纠错已进入“待人工核对”这一步。采纳后会更新正文，共建申请另行审核。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;gs-invitation&quot; id=&quot;gs-correction-invitation&quot;&gt;&lt;p class=&quot;gs-kicker&quot;&gt;也想邀请你，继续参与&lt;/p&gt;&lt;h2&gt;愿意一起完善这份指南吗？&lt;/h2&gt;&lt;p&gt;你对细节的补充，正是这份指南需要的。留下微信或其他联系方式，方便管理员和你聊聊共建。&lt;/p&gt;&lt;p class=&quot;gs-small&quot;&gt;联系方式仅管理员可见。暂不参加，也不影响本次纠错的处理。&lt;/p&gt;&lt;div class=&quot;gs-actions&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;gs-primary cursor-interaction&quot; id=&quot;gs-invite-accept&quot;&gt;我愿意参与共建&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;gs-link cursor-interaction&quot; id=&quot;gs-invite-skip&quot;&gt;这次先帮忙纠错&lt;/button&gt;&lt;/div&gt;
     &lt;form id=&quot;gs-correction-contact-form&quot; hidden&gt;&lt;div class=&quot;gs-correction-fields&quot;&gt;&lt;label&gt;联系方式&lt;select id=&quot;gs-contact-method&quot;&gt;&lt;option&gt;微信&lt;/option&gt;&lt;option&gt;邮箱&lt;/option&gt;&lt;option&gt;Telegram&lt;/option&gt;&lt;option&gt;其他方式&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;label&gt;联系账号&lt;input id=&quot;gs-contact-value&quot; required autocomplete=&quot;off&quot; maxlength=&quot;160&quot; placeholder=&quot;演示请填写测试联系方式&quot;&gt;&lt;/label&gt;&lt;label class=&quot;gs-full&quot;&gt;你熟悉的国家或主题（选填）&lt;input id=&quot;gs-contact-topic&quot; maxlength=&quot;160&quot; placeholder=&quot;例如：清迈生活、美国面谈、葡萄牙孩子就学&quot;&gt;&lt;/label&gt;&lt;label class=&quot;gs-contact-consent gs-full&quot;&gt;&lt;input type=&quot;checkbox&quot; id=&quot;gs-contact-consent&quot; required&gt;我同意管理员通过此方式就本次纠错及共建意向联系我。联系方式不公开，也不用于营销。&lt;/label&gt;&lt;/div&gt;&lt;div class=&quot;gs-actions&quot;&gt;&lt;button type=&quot;submit&quot; class=&quot;gs-primary cursor-interaction&quot;&gt;提交共建意向 · 演示&lt;/button&gt;&lt;/div&gt;&lt;/form&gt;
    &lt;/div&gt;&lt;div id=&quot;gs-correction-invite-result&quot; class=&quot;gs-note&quot; role=&quot;status&quot; hidden&gt;&lt;/div&gt;&lt;/div&gt;
   &lt;/section&gt;
   &lt;section data-view=&quot;voices&quot; hidden&gt;
    &lt;div class=&quot;gs-voices-heading&quot;&gt;&lt;div&gt;&lt;p class=&quot;gs-kicker&quot;&gt;来自世界各地的真实经验&lt;/p&gt;&lt;h1&gt;当地华人说&lt;/h1&gt;&lt;p class=&quot;gs-intro&quot;&gt;选择一个国家，看看当地人的生活与移居分享。&lt;/p&gt;&lt;/div&gt;&lt;button type=&quot;button&quot; class=&quot;gs-primary cursor-interaction&quot; data-share-link=&quot;true&quot;&gt;分享一条链接 ↗&lt;/button&gt;&lt;/div&gt;
    &lt;aside class=&quot;gs-voices-process&quot; aria-label=&quot;链接收录流程&quot;&gt;&lt;div&gt;&lt;h3&gt;一条链接，怎样成为指南内容？&lt;/h3&gt;&lt;ol&gt;&lt;li&gt;读取原文&lt;/li&gt;&lt;li&gt;AI 提炼&lt;/li&gt;&lt;li&gt;核验员审核发布&lt;/li&gt;&lt;li&gt;查看原作&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;&lt;p class=&quot;gs-voices-verification&quot;&gt;内容由熟悉当地法规、政策和实际情况的社区核验员，在授权范围内审核后直接发布。每篇都保留纠错入口，欢迎大家补充变化、指出错误。&lt;/p&gt;&lt;p&gt;摘要不替代原作；读取不全时待补充，不凭标题补写。收录不代表作者入驻，全文或视频转载须另行确认授权。&lt;/p&gt;&lt;/aside&gt;
    &lt;details class=&quot;gs-draft-browser&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;预览本轮 5 篇模拟草稿 · 未公开发布&lt;/summary&gt;&lt;p class=&quot;gs-small&quot;&gt;包含长文、短文和待补资料的例子。选择一篇，查看它在对应国家的排版。&lt;/p&gt;&lt;div id=&quot;gs-draft-jumps&quot; class=&quot;gs-draft-jumps&quot;&gt;&lt;/div&gt;&lt;/details&gt;
    &lt;label class=&quot;gs-voices-picker&quot; for=&quot;gs-voices-countries&quot;&gt;选择国家&lt;select id=&quot;gs-voices-countries&quot; class=&quot;cursor-interaction&quot; aria-label=&quot;选择国家查看当地分享&quot;&gt;&lt;/select&gt;&lt;/label&gt;
    &lt;section class=&quot;gs-voices-content&quot; aria-labelledby=&quot;gs-voices-title&quot;&gt;&lt;div class=&quot;gs-title-row&quot;&gt;&lt;h2 id=&quot;gs-voices-title&quot;&gt;美国 · 当地分享&lt;/h2&gt;&lt;button type=&quot;button&quot; class=&quot;gs-link cursor-interaction&quot; data-page=&quot;country&quot;&gt;查看国家指南 →&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;gs-voices-demo-note&quot; id=&quot;gs-voices-status-note&quot;&gt;采集预览尚待社区核验；模拟内容单独折叠。&lt;/p&gt;&lt;div id=&quot;gs-voices-list&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;&lt;/section&gt;
   &lt;/section&gt;
   &lt;section data-view=&quot;workbench&quot; hidden&gt;
    &lt;div class=&quot;gs-workbench-heading&quot;&gt;&lt;div&gt;&lt;p class=&quot;gs-kicker&quot;&gt;每个人都可以分享链接&lt;/p&gt;&lt;h1&gt;分享与共建工作台&lt;/h1&gt;&lt;/div&gt;&lt;span id=&quot;gs-workbench-role&quot; class=&quot;gs-tag&quot;&gt;访客 · 演示身份&lt;/span&gt;&lt;/div&gt;
    &lt;p class=&quot;gs-intro&quot;&gt;无需登录、加入或留下联系方式，即可分享本人或他人的移居相关链接。AI 整理后仍须社区核验员核验，提交不会自动获得成员资格。&lt;/p&gt;
    &lt;label class=&quot;gs-preview-role&quot;&gt;预览身份&lt;select id=&quot;gs-preview-role&quot;&gt;&lt;option value=&quot;visitor&quot;&gt;访客（无需加入）&lt;/option&gt;&lt;option value=&quot;member&quot;&gt;当地共建者（演示）&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;
    &lt;div class=&quot;gs-submission-tabs&quot; aria-label=&quot;选择投稿方式&quot;&gt;&lt;button type=&quot;button&quot; id=&quot;gs-link-tab&quot; class=&quot;gs-secondary cursor-interaction&quot; data-submit-mode=&quot;link&quot; aria-pressed=&quot;true&quot; aria-controls=&quot;gs-link-fields&quot;&gt;分享外站链接&lt;/button&gt;&lt;button type=&quot;button&quot; id=&quot;gs-article-tab&quot; class=&quot;gs-secondary cursor-interaction&quot; data-submit-mode=&quot;article&quot; aria-pressed=&quot;false&quot; aria-controls=&quot;gs-article-fields&quot;&gt;在社区写文章&lt;/button&gt;&lt;/div&gt;
    &lt;div id=&quot;gs-original-gate&quot; class=&quot;gs-note&quot; hidden&gt;&lt;h2&gt;写原创文章，先申请当地共建者&lt;/h2&gt;&lt;p class=&quot;gs-small&quot;&gt;通过管理员准入审核后，可以在社区写原创文章。分享外站链接和纠错始终向访客开放。&lt;/p&gt;&lt;div class=&quot;gs-actions&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;gs-primary cursor-interaction&quot; data-join-apply=&quot;true&quot;&gt;申请当地共建者&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;gs-link cursor-interaction&quot; data-submit-mode=&quot;link&quot;&gt;继续分享链接 →&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;gs-small&quot;&gt;想体验写作流程，可将上方预览身份切换为“当地共建者（演示）”，这不会创建真实账号。&lt;/p&gt;&lt;/div&gt;
    &lt;form id=&quot;gs-submission-form&quot; class=&quot;gs-form gs-submission-form&quot;&gt;
     &lt;div class=&quot;gs-full gs-title-row&quot; style=&quot;margin-bottom:0&quot;&gt;&lt;h2 id=&quot;gs-submission-heading&quot;&gt;分享一条值得收录的链接&lt;/h2&gt;&lt;div class=&quot;gs-actions&quot;&gt;&lt;button type=&quot;button&quot; id=&quot;gs-submission-positive-example&quot; class=&quot;gs-secondary cursor-interaction&quot;&gt;体验完整模拟投稿&lt;/button&gt;&lt;button type=&quot;button&quot; id=&quot;gs-submission-example&quot; class=&quot;gs-link cursor-interaction&quot;&gt;填入演示稿&lt;/button&gt;&lt;button type=&quot;button&quot; id=&quot;gs-submission-own-link&quot; class=&quot;gs-link cursor-interaction&quot; hidden&gt;改用自己的链接 →&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;
     &lt;div id=&quot;gs-link-fields&quot; class=&quot;gs-full gs-submission-fields&quot; aria-labelledby=&quot;gs-link-tab&quot;&gt;
      &lt;label class=&quot;gs-full&quot;&gt;原始链接&lt;input id=&quot;gs-submit-url&quot; type=&quot;url&quot; required maxlength=&quot;1800&quot; placeholder=&quot;粘贴 X、TikTok、抖音、YouTube 等原始链接&quot;&gt;&lt;/label&gt;
      &lt;label&gt;这是谁的作品？&lt;select id=&quot;gs-submit-relationship&quot;&gt;&lt;option value=&quot;self&quot;&gt;我的作品&lt;/option&gt;&lt;option value=&quot;third&quot;&gt;推荐第三方作品&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;
      &lt;label&gt;原作者 / 账号（选填）&lt;input id=&quot;gs-submit-author&quot; maxlength=&quot;100&quot; placeholder=&quot;暂不清楚可留空，审核时继续核对&quot;&gt;&lt;/label&gt;
      &lt;p class=&quot;gs-small gs-full&quot;&gt;推荐链接不等于获得转载授权，也不代表原作者已经入驻。审核时核对出处、读取范围和引用方式。&lt;/p&gt;
     &lt;/div&gt;
     &lt;label class=&quot;gs-full&quot;&gt;&lt;span id=&quot;gs-submit-title-label&quot;&gt;推荐标题（选填）&lt;/span&gt;&lt;input id=&quot;gs-submit-title&quot; maxlength=&quot;120&quot; placeholder=&quot;这条分享能帮助读者解决什么问题？&quot;&gt;&lt;/label&gt;
     &lt;p class=&quot;gs-full gs-small&quot; id=&quot;gs-auto-classification-note&quot;&gt;国家、城市与主题由 AI 建议，人工审核确认。当前草图未连接服务，新链接保持待识别。&lt;/p&gt;
     &lt;div id=&quot;gs-link-ai-area&quot; class=&quot;gs-full&quot;&gt;&lt;div class=&quot;gs-actions&quot;&gt;&lt;button type=&quot;button&quot; id=&quot;gs-link-ai-prepare&quot; class=&quot;gs-secondary cursor-interaction&quot;&gt;AI 整理 · 演示&lt;/button&gt;&lt;span class=&quot;gs-small&quot;&gt;先查看摘要与核心点，再提交人工审核&lt;/span&gt;&lt;/div&gt;&lt;p id=&quot;gs-link-ai-hint&quot; class=&quot;gs-submission-helper&quot;&gt;请提供移居相关链接；范围外示例仅用于版式与范围校验。&lt;/p&gt;&lt;div id=&quot;gs-link-ai-result&quot; class=&quot;gs-ai-draft&quot; aria-live=&quot;polite&quot; hidden&gt;&lt;/div&gt;&lt;details class=&quot;gs-source-scope&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;推文和视频，分别依据什么整理？&lt;/summary&gt;&lt;p&gt;推文：注明读取的是完整正文、线程的哪几条，还是仅部分文字；未读取的关联帖子不计入摘要。&lt;/p&gt;&lt;p&gt;视频：注明依据平台字幕、语音转写或实际查看的画面。只有转写时不推断画面内容，未取得字幕或转写时不生成内容摘要。&lt;/p&gt;&lt;p&gt;当前草图没有接入采集与 AI。原文未读不能提取移居事实；移居相关新链接可先提交待补充线索，范围外参考稿不能收录。&lt;/p&gt;&lt;/details&gt;&lt;/div&gt;
     &lt;details id=&quot;gs-classification-panel&quot; class=&quot;gs-full&quot; hidden&gt;&lt;summary id=&quot;gs-classification-heading&quot; class=&quot;cursor-interaction&quot;&gt;可选：人工补充国家与主题&lt;/summary&gt;&lt;label&gt;国家&lt;select id=&quot;gs-submit-country&quot; aria-label=&quot;投稿归属国家&quot;&gt;&lt;/select&gt;&lt;/label&gt;&lt;fieldset class=&quot;gs-topic-fieldset&quot;&gt;&lt;legend&gt;涉及主题（可多选）&lt;/legend&gt;&lt;div id=&quot;gs-submit-topic&quot; class=&quot;gs-topic-choices&quot;&gt;&lt;/div&gt;&lt;p class=&quot;gs-submission-helper&quot;&gt;只选原文提到的主题；不清楚可留空待识别。人工补充不等于 AI 已识别，仍需审核确认。&lt;/p&gt;&lt;/fieldset&gt;&lt;/details&gt;
     &lt;div id=&quot;gs-article-fields&quot; class=&quot;gs-full&quot; aria-labelledby=&quot;gs-article-tab&quot; hidden&gt;&lt;label&gt;文章正文&lt;textarea id=&quot;gs-submit-body&quot; disabled maxlength=&quot;10000&quot; placeholder=&quot;写明发生时间、城市、个人条件、具体经历，以及仍待确认的问题；引用资料时请附来源。&quot;&gt;&lt;/textarea&gt;&lt;/label&gt;&lt;p class=&quot;gs-submission-helper&quot;&gt;原创文章也须由其他社区核验员核验。请勿加入中介获客、代办推广或佣金导流。&lt;/p&gt;&lt;/div&gt;
     &lt;p id=&quot;gs-submission-error&quot; class=&quot;gs-full gs-submission-error&quot; role=&quot;alert&quot; hidden&gt;&lt;/p&gt;
     &lt;div class=&quot;gs-full gs-actions&quot;&gt;&lt;button type=&quot;submit&quot; id=&quot;gs-submission-send&quot; class=&quot;gs-primary cursor-interaction&quot; disabled&gt;先完成 AI 整理步骤&lt;/button&gt;&lt;span class=&quot;gs-small&quot;&gt;草图不抓取、不发送、不自动发布&lt;/span&gt;&lt;/div&gt;
    &lt;/form&gt;
    &lt;div id=&quot;gs-submission-result&quot; class=&quot;gs-note&quot; role=&quot;status&quot; hidden&gt;&lt;/div&gt;
    &lt;div class=&quot;gs-section&quot;&gt;&lt;div class=&quot;gs-title-row&quot;&gt;&lt;h2&gt;本次投稿记录&lt;/h2&gt;&lt;span id=&quot;gs-submission-count&quot; class=&quot;gs-small&quot; aria-live=&quot;polite&quot;&gt;本次演示暂无投稿&lt;/span&gt;&lt;/div&gt;&lt;p class=&quot;gs-small&quot;&gt;这里是本地演示回执，刷新后清空，不是账号历史。范围外参考只展示格式；草图未实际采集、调用 AI 或执行审核。&lt;/p&gt;&lt;div id=&quot;gs-submission-list&quot; class=&quot;gs-submission-list&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;details class=&quot;gs-permissions&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;谁负责审核与发布？&lt;/summary&gt;&lt;p&gt;所有访客均可推荐本人或第三方链接，无需加入或留下联系方式。当地共建者还可写原创文章；不能审核或直接发布自己的投稿。&lt;/p&gt;&lt;p&gt;社区核验员经管理员授予审核权后，可在授权国家核验他人内容并直接发布，无需再逐篇交管理员审批。权限可撤销，自己的投稿仍由其他社区核验员处理。&lt;/p&gt;&lt;p&gt;管理员负责成员准入、审核权授予与收回、争议处理。国家 AI 概览及四项五星评分仍须由管理员审批。&lt;/p&gt;&lt;p&gt;所有投稿均须遵守社区规则：拒绝中介获客、代办推广及佣金导流。未通过共建申请，也仍可作为访客分享非营销链接或纠错。&lt;/p&gt;&lt;/details&gt;
   &lt;/section&gt;
   &lt;section data-view=&quot;join&quot; hidden&gt;
    &lt;p class=&quot;gs-kicker&quot;&gt;分享向所有人开放 · 权限与责任对应&lt;/p&gt;&lt;h1&gt;参与方式与权益&lt;/h1&gt;&lt;p class=&quot;gs-intro&quot;&gt;可以先分享一条链接，也可以申请长期共建。内容公开须经人工审核，社区拒绝中介获客、代办推广与佣金导流。&lt;/p&gt;
    &lt;div class=&quot;gs-actions&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;gs-primary cursor-interaction&quot; data-share-link=&quot;true&quot;&gt;人人分享链接&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;gs-secondary cursor-interaction&quot; data-join-apply=&quot;true&quot;&gt;申请当地共建者&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;gs-role-grid&quot; aria-label=&quot;参与方式与职责&quot;&gt;&lt;section&gt;&lt;h3&gt;01 / 访客&lt;/h3&gt;&lt;p&gt;分享本人或他人的 X、TikTok、抖音、YouTube 链接；纠错、补充最新情况。&lt;/p&gt;&lt;p&gt;无需登录、加入或留下联系方式。分享后仍经 AI 整理与人工审核，不自动成为成员。&lt;/p&gt;&lt;/section&gt;&lt;section&gt;&lt;h3&gt;02 / 当地共建者&lt;/h3&gt;&lt;p&gt;须现居当地，或曾长期居住且熟悉实情，由管理员按国家审核。加入后可写原创文章，参与持续维护。&lt;/p&gt;&lt;p&gt;公开贡献署名、作品与采纳记录，逐渐形成个人贡献档案。国家页和文章内可查看档案样式；当前为本地演示，尚未连接真实账号历史。&lt;/p&gt;&lt;/section&gt;&lt;section&gt;&lt;h3&gt;03 / 社区核验员&lt;/h3&gt;&lt;p&gt;从熟悉当地法规、政策和实际情况，且持续贡献可靠内容的当地共建者中选出。获授权后，可独立审核并直接发布负责国家的他人稿件，跟进读者纠错；自己的内容交由其他社区核验员处理。&lt;/p&gt;&lt;p&gt;同样须现居当地，或曾长期居住且熟悉实情，按国家核对。再根据持续有依据的贡献与核验能力授权；可撤销，不按投稿数量自动授予审核权。&lt;/p&gt;&lt;/section&gt;&lt;section&gt;&lt;h3&gt;04 / 管理员&lt;/h3&gt;&lt;p&gt;审核成员准入，授予与撤销审核权限，处理争议，审批国家总览及五星评分。&lt;/p&gt;&lt;p&gt;维护社区规则与审核记录，不以付费购买发布权。&lt;/p&gt;&lt;/section&gt;&lt;/div&gt;
    &lt;p class=&quot;gs-small&quot; style=&quot;margin-top:20px&quot;&gt;共建者身份不保证观点正确。所有公开内容仍需核对来源、适用条件与时效，任何人都可以纠错。&lt;/p&gt;
    &lt;details id=&quot;gs-join-application&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;申请当地共建者 · 由管理员审核&lt;/summary&gt;
    &lt;form class=&quot;gs-form&quot; id=&quot;gs-join-form&quot;&gt;
     &lt;p class=&quot;gs-small gs-full&quot;&gt;共建资格按国家分别审核：须目前在当地生活并熟悉实情，或曾长期居住且持续了解当地。短期旅游、单纯转述资料不足以证明在地了解，不设置虚构的统一年限门槛。&lt;/p&gt;
     &lt;label&gt;申请哪个国家？&lt;select id=&quot;gs-join-country&quot; aria-label=&quot;申请共建的国家&quot;&gt;&lt;/select&gt;&lt;/label&gt;&lt;label&gt;熟悉的城市&lt;input id=&quot;gs-join-city&quot; required maxlength=&quot;100&quot; placeholder=&quot;填写实际生活过的城市&quot;&gt;&lt;/label&gt;
     &lt;label class=&quot;gs-full&quot;&gt;你的在地经历&lt;select id=&quot;gs-join-residency&quot;&gt;&lt;option value=&quot;current&quot;&gt;目前在当地生活，熟悉实际情况&lt;/option&gt;&lt;option value=&quot;former&quot;&gt;曾长期居住，持续了解当地（非当前居民）&lt;/option&gt;&lt;option value=&quot;none&quot;&gt;无长期在地经历 / 仅短期旅行或资料研究&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;
     &lt;label&gt;居住起止或累计时长&lt;input id=&quot;gs-join-duration&quot; required maxlength=&quot;160&quot; placeholder=&quot;起止年月或累计居住时长，不设统一年限&quot;&gt;&lt;/label&gt;&lt;label&gt;最近在当地时间 / 离开时间&lt;input id=&quot;gs-join-last-seen&quot; required maxlength=&quot;160&quot; placeholder=&quot;仍在当地，或最近停留、离开的时间&quot;&gt;&lt;/label&gt;
     &lt;label class=&quot;gs-full&quot;&gt;熟悉的领域&lt;select id=&quot;gs-join-role&quot;&gt;&lt;option&gt;生活物价&lt;/option&gt;&lt;option&gt;移民通道&lt;/option&gt;&lt;option&gt;政策与实操差异&lt;/option&gt;&lt;option&gt;避坑提醒&lt;/option&gt;&lt;option&gt;孩子教育&lt;/option&gt;&lt;option&gt;医疗与日常&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;
     &lt;label class=&quot;gs-full&quot;&gt;一条具体经历说明或公开资料&lt;textarea id=&quot;gs-join-evidence&quot; required maxlength=&quot;2000&quot; placeholder=&quot;说明你在当地亲自经历过的一件事，包含时间和背景；也可提供能体现持续在地了解的公开资料链接。&quot;&gt;&lt;/textarea&gt;&lt;/label&gt;
     &lt;label class=&quot;gs-full&quot;&gt;是否从事中介、代办或佣金推广？&lt;select id=&quot;gs-join-business&quot;&gt;&lt;option value=&quot;none&quot;&gt;否&lt;/option&gt;&lt;option value=&quot;yes&quot;&gt;是&lt;/option&gt;&lt;option value=&quot;unclear&quot;&gt;需要进一步说明&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;
     &lt;p class=&quot;gs-small gs-full&quot;&gt;填写后仅进入待人工核对，不等于通过准入。曾居住者会明确标注“曾居住”。此处不收证件或必填联系方式，也不发送、保存申请资料。&lt;/p&gt;
     &lt;div class=&quot;gs-full&quot;&gt;&lt;button type=&quot;submit&quot; class=&quot;gs-primary cursor-interaction&quot;&gt;预览申请结果&lt;/button&gt;&lt;/div&gt;
    &lt;/form&gt;&lt;div id=&quot;gs-application-result&quot; class=&quot;gs-note&quot; aria-live=&quot;polite&quot; hidden&gt;&lt;/div&gt;
    &lt;/details&gt;&lt;div class=&quot;gs-section&quot;&gt;&lt;h2&gt;也可以从一次纠错开始&lt;/h2&gt;&lt;p class=&quot;gs-intro&quot;&gt;任何读者都可以直接提交纠错，无需先申请成员资格。纠错提交后，我们会邀请你自愿留下联系方式、继续参与共建；不留联系方式也不影响纠错处理。&lt;/p&gt;&lt;button type=&quot;button&quot; class=&quot;gs-link cursor-interaction&quot; data-contribute=&quot;纠错与更新&quot;&gt;先提交一条纠错 →&lt;/button&gt;&lt;/div&gt;

 const topics={intro:{name:&#x27;开始之前&#x27;,title:&#x27;先写下你想解决的问题&#x27;,lead:&#x27;把目标、已有条件和未知问题分开。&#x27;,copy:&#x27;一份有用的指南，应该从读者的问题出发。先记录自己的目标和生活安排，再带着问题查找不同国家的资料与经历。&#x27;,points:[&#x27;写下这次移居最希望改善的事情，以及不能妥协的条件。&#x27;,&#x27;列出需要进一步确认的身份、时间、家庭与生活安排。&#x27;,&#x27;阅读相似经历时，检查对方的前提与你是否相同。&#x27;],question:&#x27;如果我还没确定国家，可以先从哪些问题开始整理？&#x27;},identity:{name:&#x27;身份与居留&#x27;,title:&#x27;看一条办理经历，先确认哪些条件？&#x27;,lead:&#x27;先找出这条经验成立的前提。&#x27;,copy:&#x27;一段办理经历通常只描述某个人、某个时间和地点的情况。把这些条件补齐，才便于进一步判断它与你的问题是否相关。&#x27;,points:[&#x27;确认办理城市、发生日期、申请类别和申请人当时的条件。&#x27;,&#x27;分清预约、递交、受理、获批和领取文件分别发生在何时。&#x27;,&#x27;将官方说明与个人经历分开记录，保留差异和尚待核实的问题。&#x27;],question:&#x27;分享办理耗时时，应该从预约、递交还是领取文件开始记录？&#x27;},process:{name:&#x27;真实办理记录&#x27;,title:&#x27;一次经历，怎样记录得足够完整？&#x27;,lead:&#x27;把过程写清楚，也留下后续。&#x27;,copy:&#x27;成功、补件、延期和未完成的过程，都能帮助后来的人提出更准确的问题。记录时可以沿着时间顺序组织信息。&#x27;,points:[&#x27;说明本人条件、办理地点与原本要解决的问题。&#x27;,&#x27;分别记录准备、提交、反馈与结果，不省略重要前置步骤。&#x27;,&#x27;后续情况有变化时，补充更新日期和具体变化。&#x27;],question:&#x27;如果事情还没办完，可以先贡献已经发生的过程吗？&#x27;},living:{name:&#x27;工作与生活&#x27;,title:&#x27;租房之前，把费用与约定问清楚&#x27;,lead:&#x27;先让不同经历具备可以比较的条件。&#x27;,copy:&#x27;比较租房经历时，先记录城市、片区、房型、租期和发生时间。相同的报价可能包含不同费用，缺少条件时可以请分享者继续补充。&#x27;,points:[&#x27;分别记录租金、押金，以及报价包含或不包含的额外费用。&#x27;,&#x27;把租期、提前离开和押金退还的约定列成问题清单。&#x27;,&#x27;将口头说明与书面约定对应起来，标出仍需向对方确认的部分。&#x27;],question:&#x27;别人分享的总费用，应该同时说明包含了哪些项目吗？&#x27;},family:{name:&#x27;家庭与教育&#x27;,title:&#x27;全家一起迁居，需要共同确认什么？&#x27;,lead:&#x27;把每位家庭成员的安排放在一起看。&#x27;,copy:&#x27;同一次迁居可能对应不同人的时间表和生活需要。先把问题列出来，再寻找相应地区的资料和家庭经历。&#x27;,points:[&#x27;记录每位家庭成员的学习、工作、照护和沟通需求。&#x27;,&#x27;区分已经确认的安排与仍依赖其他事项的计划。&#x27;,&#x27;向有相似家庭条件的亲历者提问，记录差异和后续变化。&#x27;],question:&#x27;一家人计划在不同时间抵达，哪些问题适合提前共同讨论？&#x27;}};

 const voiceExamples=[
  {id:&#x27;demo-us-interview&#x27;,country:&#x27;us&#x27;,city:&#x27;洛杉矶&#x27;,platform:&#x27;X&#x27;,author:&#x27;洛城小林&#x27;,title:&#x27;面谈前一周，我把材料按问题重新整理了一遍&#x27;,topic:&#x27;面谈准备&#x27;,occurredAt:&#x27;2026-09-16&#x27;,sourceDate:&#x27;2026-09-18&#x27;,sourceText:&#x27;模拟经历：准备面谈时，我先按自己的预约通知核对材料，再把需要说明的经历按时间顺序写在一张纸上。文件夹里分别放预约相关文件、对应的记录和仍需确认的问题。这只是我的整理方式，目前没有面谈结果，也不能把我的清单当成所有人都适用的材料要求。&#x27;,summary:&#x27;一份模拟面谈准备记录：先对照个人通知，再把经历时间线与文件对应起来，单独列出尚未确认的问题。&#x27;,points:[&#x27;以本人的预约通知为核对起点，没有提供通用材料清单。&#x27;,&#x27;把需要说明的经历按时间整理，与对应记录放在一起。&#x27;,&#x27;故事只记录准备过程，没有面谈结果或通过承诺。&#x27;],scope:&#x27;一名洛杉矶居民的虚构准备经历，未指定申请类别，不构成实际办理要求。&#x27;},
  {id:&#x27;demo-pt-address&#x27;,country:&#x27;pt&#x27;,city:&#x27;里斯本&#x27;,platform:&#x27;YouTube&#x27;,author:&#x27;里斯本阿禾&#x27;,title:&#x27;都叫“地址证明”，两次办事问到的材料却不一样&#x27;,topic:&#x27;政策与实操差异&#x27;,occurredAt:&#x27;2026-09-11&#x27;,sourceDate:&#x27;2026-09-14&#x27;,sourceText:&#x27;模拟经历：我在不同机构办理两件事，都被问到地址材料。第一次提交后没有再被询问，第二次却让我补充信息。我把机构、用途、通知原文和日期分别记下，再向受理方确认原因。目前没有证据说明规定统一改变了，更不能把一次补充材料的经历当成全国要求。&#x27;,summary:&#x27;模拟亲历者遇到两次不同的材料反馈，先核对机构、事项与通知，保留尚待确认的差异，没有据此推断政策变动。&#x27;,points:[&#x27;两次办理的机构与事项不同，材料反馈不能直接比较。&#x27;,&#x27;分别保留通知、提交材料与发生日期，向受理方确认。&#x27;,&#x27;原因尚未明确，没有官方条文或全国性结论。&#x27;],scope:&#x27;里斯本两次虚构办事经历，不对应任何真实机构规定。&#x27;},
  {id:&#x27;demo-rs-rental&#x27;,country:&#x27;rs&#x27;,city:&#x27;贝尔格莱德&#x27;,platform:&#x27;X&#x27;,author:&#x27;多瑙河小安&#x27;,title:&#x27;看房时听到的“总价”，为什么和第一笔付款不同？&#x27;,topic:&#x27;租房避坑&#x27;,occurredAt:&#x27;2026-09-20&#x27;,sourceDate:&#x27;2026-09-22&#x27;,sourceText:&#x27;模拟经历：看房时我只记了每月房租，准备入住时才把押金、水电、网络和其他费用逐项问清。有些是一次性支付，有些按月发生。我请对方把包含和不包含的项目写下来，并核对房内已有设备。这份清单只说明这处房子的约定，不代表整座城市的租房行情。&#x27;,summary:&#x27;模拟租客把月租、一次性支出与按月费用分开记录，确认报价包含项，避免把房租当成全部入住成本。&#x27;,points:[&#x27;区分月租、押金等一次性付款和后续月度开支。&#x27;,&#x27;将口头报价中的包含项与额外项目整理为书面记录。&#x27;,&#x27;只描述一处房源的假设情境，没有提供城市均价。&#x27;],scope:&#x27;一处贝尔格莱德房源的虚构交涉过程，具体条款须以实际约定为准。&#x27;},
  {id:&#x27;demo-th-budget&#x27;,country:&#x27;th&#x27;,city:&#x27;清迈&#x27;,platform:&#x27;抖音&#x27;,author:&#x27;清迈小周&#x27;,title:&#x27;一家三口的月度账本：房租之外，还要记哪些开支？&#x27;,topic:&#x27;生活物价&#x27;,occurredAt:&#x27;2026-09&#x27;,sourceDate:&#x27;2026-10-01&#x27;,sourceText:&#x27;模拟账本：两位成人与一名孩子在清迈的假设月度支出，房租 15,000 泰铢、餐饮 9,000 泰铢、交通 2,500 泰铢、水电网络 1,500 泰铢，合计 28,000 泰铢。不含学费、保险、签证相关费用和旅行。所有金额都为排版演示虚构，不是实际支出或当地报价。&#x27;,summary:&#x27;用一份虚构家庭账本展示费用整理方式：按泰铢／月分项，并明确未计入的教育、保险等费用。&#x27;,points:[&#x27;示例月度合计为 28,000 泰铢，家庭口径为两位成人与一名孩子。&#x27;,&#x27;房租、餐饮、交通、水电网络分列，避免只比较房租。&#x27;,&#x27;不含学费、保险、签证相关费用和旅行；金额均为虚构。&#x27;],scope:&#x27;虚构的两成人一孩子家庭预算，用于展示金额、币种与计价周期，不用于估算清迈真实成本。&#x27;},
  {id:&#x27;demo-au-school&#x27;,country:&#x27;au&#x27;,city:&#x27;墨尔本&#x27;,platform:&#x27;抖音&#x27;,author:&#x27;南岸小禾&#x27;,title:&#x27;墨尔本看房：我们漏算了接送孩子的时间&#x27;,topic:&#x27;孩子教育&#x27;,occurredAt:&#x27;2026-09-09&#x27;,sourceDate:&#x27;2026-09-12&#x27;,sourceText:&#x27;模拟经历：搬家前，我只看了地图上的开车时间。实际接送孩子时，校门附近停车、步行进校和雨天候车又花了不少时间。后来我们按上学时段重新走了一遍路线，也询问学校放学后的安排，才发现原先的接送计划需要调整。&#x27;,summary:&#x27;模拟家庭发现地图车程没有涵盖停车与进校时间，重新实走通学路线后，调整了接送安排。&#x27;,points:[&#x27;只看地图车程，漏算了停车与步行进校的时间。&#x27;,&#x27;按上学时段实走路线，并考虑雨天候车情况。&#x27;,&#x27;了解放学后的安排，再调整家庭接送计划。&#x27;],scope:&#x27;一户墨尔本家庭的虚构通学经历，不涉及入学资格、学区认定或普遍规则。&#x27;},
  {id:&#x27;demo-nz-car&#x27;,country:&#x27;nz&#x27;,city:&#x27;奥克兰&#x27;,platform:&#x27;YouTube&#x27;,author:&#x27;北岸阿木&#x27;,title:&#x27;二手车照片很漂亮，试驾后我还是决定再看看&#x27;,topic:&#x27;避坑提醒&#x27;,occurredAt:&#x27;2026-09-14&#x27;,sourceDate:&#x27;2026-09-16&#x27;,sourceText:&#x27;模拟经历：到奥克兰后想买辆二手车，照片和卖家的介绍都很吸引人。看车时，我发现后备箱空间与想象不同，试驾还听到不熟悉的声音。我先请独立检查人员看看，并索要已有保养记录，没有因为当天有人催着决定就付款。&#x27;,summary:&#x27;模拟买家实地看车后发现空间和试驾感受与预期不同，先安排检查、查看记录，再决定是否购买。&#x27;,points:[&#x27;照片难以判断实际装载空间，现场体验与预期不同。&#x27;,&#x27;试驾听到不熟悉的声音，交由独立检查人员判断。&#x27;,&#x27;索要保养记录，没有因催促而立即付款。&#x27;],scope:&#x27;一名奥克兰新住民的虚构购车经历，不含车辆检测结论或法律说明。&#x27;},
  {id:&#x27;demo-mx-handover&#x27;,country:&#x27;mx&#x27;,city:&#x27;墨西哥城&#x27;,platform:&#x27;X&#x27;,author:&#x27;巷口小满&#x27;,title:&#x27;搬进去才发现没有热水：交房时漏做的那一步&#x27;,topic:&#x27;租房避坑&#x27;,occurredAt:&#x27;2026-09-18&#x27;,sourceDate:&#x27;2026-09-20&#x27;,sourceText:&#x27;模拟经历：看房时觉得采光和位置都不错，交房当天却只拍了家具照片。晚上才发现热水设备没有正常工作。我把问题和照片发给房东，约了检查时间，也补记了钥匙、设备和已有损坏。以后会把设备实际运行一起放进交接记录。&#x27;,summary:&#x27;模拟租客交房时仅拍家具，入住后发现热水问题；随后联系房东检查，并补充设备与损坏记录。&#x27;,points:[&#x27;交房时拍了家具照片，但没有试用热水设备。&#x27;,&#x27;发现问题后发送记录，并另约设备检查时间。&#x27;,&#x27;补记钥匙、设备状态与已有损坏，保留交接信息。&#x27;],scope:&#x27;一处墨西哥城出租房的虚构入住经历，不代表当地租赁规则。&#x27;},
  {id:&#x27;demo-ar-timeline&#x27;,country:&#x27;ar&#x27;,city:&#x27;布宜诺斯艾利斯&#x27;,platform:&#x27;TikTok&#x27;,author:&#x27;河岸阿宁&#x27;,title:&#x27;“材料交完了”之后，我把每一步的日期单独记下来&#x27;,topic:&#x27;办理经历&#x27;,occurredAt:&#x27;2026-09-23&#x27;,sourceDate:&#x27;2026-09-25&#x27;,sourceText:&#x27;模拟经历：准备一次居留相关材料时，我照着朋友以前的经历列了清单。轮到自己的预约，工作人员又询问了我的具体情况。我把预约、到场、被要求补充资料的日期分别记下，保留了通知；目前仍待后续答复，不能把朋友的进度当成自己的结果。&#x27;,summary:&#x27;模拟申请人参考朋友的旧经历准备材料，现场仍需补充信息；分别记录办理节点，目前结果尚未确定。&#x27;,points:[&#x27;朋友过去的清单仅作为参考，不能确认适用于本次情况。&#x27;,&#x27;分别记录预约、到场与补充资料的日期，并保留通知。&#x27;,&#x27;仍待后续答复，没有获批结果或办理时长承诺。&#x27;],scope:&#x27;一次虚构的居留材料准备经历，未指定通道或资格条件，不提供法案结论。&#x27;}
